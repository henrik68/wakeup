<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Old-fashioned twin-bell alarm clock -->
  <rect width="256" height="256" rx="48" fill="#3b2a6b"/>
  <!-- legs -->
  <path d="M78 196 L60 222" stroke="#f2b632" stroke-width="14" stroke-linecap="round"/>
  <path d="M178 196 L196 222" stroke="#f2b632" stroke-width="14" stroke-linecap="round"/>
  <!-- bells + hammer -->
  <path d="M42 86 A40 40 0 0 1 98 42 Z" fill="#f2b632"/>
  <path d="M214 86 A40 40 0 0 0 158 42 Z" fill="#f2b632"/>
  <rect x="122" y="32" width="12" height="22" rx="4" fill="#f2b632"/>
  <rect x="104" y="26" width="48" height="12" rx="6" fill="#f2b632"/>
  <!-- body -->
  <circle cx="128" cy="140" r="78" fill="#f2b632"/>
  <circle cx="128" cy="140" r="64" fill="#fff8e6"/>
  <!-- hour ticks -->
  <g fill="#3b2a6b">
    <rect x="124" y="82" width="8" height="14" rx="3"/>
    <rect x="124" y="184" width="8" height="14" rx="3"/>
    <rect x="70" y="136" width="14" height="8" rx="3"/>
    <rect x="172" y="136" width="14" height="8" rx="3"/>
  </g>
  <!-- hands -->
  <path d="M128 140 L128 102" stroke="#3b2a6b" stroke-width="9" stroke-linecap="round"/>
  <path d="M128 140 L156 156" stroke="#3b2a6b" stroke-width="9" stroke-linecap="round"/>
  <circle cx="128" cy="140" r="8" fill="#e95420"/>
</svg>
